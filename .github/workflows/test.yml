name: Test Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build test image
      run: docker build -f dockerfile.test -t test-workflow .
    - name: Run test image
      run: docker run --rm test-workflow
